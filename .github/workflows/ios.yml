name: iOS launcher foundation
on:
  push:
    branches: [main, 'codex/ios-*']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core storage and safety tests
        working-directory: ios/Core
        run: swift test
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iPhone simulator application
        working-directory: ios
        run: >-
          xcodebuild -project Sts2Launcher.xcodeproj -scheme Sts2Launcher
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-preview
          path: ios/build/Build/Products/Debug-iphonesimulator/Sts2Launcher.app
